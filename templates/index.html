<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Study Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <header>
      <h1>📚 AI Study Assistant</h1>
      <p>Ask a question, get a summary, or generate a quick quiz.</p>
    </header>

    <div class="modes">
      <button class="mode-btn active" data-mode="ask">Ask</button>
      <button class="mode-btn" data-mode="summarize">Summarize Topic</button>
      <button class="mode-btn" data-mode="quiz">Quiz Me</button>
    </div>

    <div id="chat" class="chat"></div>

    <form id="chat-form">
      <input
        id="question"
        type="text"
        placeholder="e.g. Explain binary search trees"
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const modeButtons = document.querySelectorAll(".mode-btn");
    let currentMode = "ask";

    modeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        modeButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
      });
    });

    function addMessage(text, sender) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";
      const loadingBubble = addMessage("Thinking...", "bot loading");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, mode: currentMode }),
        });
        const data = await res.json();
        loadingBubble.remove();

        if (!res.ok) {
          addMessage(data.error || "Something went wrong.", "bot error");
          return;
        }
        addMessage(data.answer, "bot");
      } catch (err) {
        loadingBubble.remove();
        addMessage("Network error. Is the server running?", "bot error");
      }
    });
  </script>
</body>
</html>
